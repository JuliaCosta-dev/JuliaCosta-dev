
name: Update GitHub Stats

on:
  # Atualiza quando houver alterações no próprio repositório de perfil.
  push:
    branches:
      - "**"
    paths-ignore:
      - "profile/*.svg"

  # Atualização automática a cada 6 horas.
  schedule:
    - cron: "17 */6 * * *"

  # Permite executar manualmente.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats-update
  cancel-in-progress: false

jobs:
  build:
    name: Generate GitHub Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes detected in GitHub Stats."
            exit 0
          fi

          git commit -m "chore: update GitHub profile stats"
          git push
